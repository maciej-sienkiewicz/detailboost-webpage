<style>
@font-face { font-family: 'InterDB'; src: url(../a/inter-latin-ext-wght-normal.woff2) format('woff2'); font-weight: 100 900; font-display: swap; unicode-range: U+0100-02AF, U+0304, U+0308, U+0329, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }
@font-face { font-family: 'InterDB'; src: url(../a/inter-latin-wght-normal.woff2) format('woff2'); font-weight: 100 900; font-display: swap; unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
/* Page: help-centre look. Stage: style B, caption column on the left, the settings page and the protocol on the right. */
:root {
  --bg: #eef2f7; --surface: #ffffff; --ink: #0f172a; --ink-2: #475569; --muted: #64748b; --line: #e2e8f0;
  --brand: #0ea5e9; --brand-ink: #0369a1; --brand-soft: #e0f2fe;
  --font: 'InterDB', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #0b1120; --surface: #111a2c; --ink: #e8eef7; --ink-2: #a5b4c8; --muted: #8394ab; --line: #1f2b40; --brand-ink: #7dd3fc; --brand-soft: #0c2a40; color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #0b1120; --surface: #111a2c; --ink: #e8eef7; --ink-2: #a5b4c8; --muted: #8394ab; --line: #1f2b40; --brand-ink: #7dd3fc; --brand-soft: #0c2a40; color-scheme: dark; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.55; -webkit-font-smoothing: antialiased;
  padding: 36px max(16px, env(safe-area-inset-right, 0px)) 72px max(16px, env(safe-area-inset-left, 0px)); }
.wrap { max-width: 1240px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
.eyebrow { font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--brand-ink); }
h1 { font-size: clamp(30px, 5vw, 46px); line-height: 1.08; letter-spacing: -0.035em; font-weight: 800; margin: 6px 0 0; text-wrap: balance; }
.lede { font-size: 17px; color: var(--ink-2); margin: 0; max-width: 760px; }

.player { position: relative; width: 100%; aspect-ratio: 16 / 9; border-radius: 16px; overflow: hidden; background: #eef2f7; box-shadow: 0 20px 50px rgba(15,23,42,.16); }
.stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; font-family: var(--font); color: #0f172a; background: #eef2f7; }
.bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.bar button { font: 600 14px var(--font); height: 40px; padding: 0 16px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
.bar button.pri { background: #0ea5e9; border-color: #0ea5e9; color: #fff; min-width: 120px; justify-content: center; }
.bar button:focus-visible { outline: 3px solid #38bdf8; outline-offset: 2px; }
.bar label { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; color: var(--ink-2); cursor: pointer; }
.bar .sp { flex: 1; }
.scrub { position: relative; height: 8px; border-radius: 4px; background: var(--line); cursor: pointer; }
.scrub i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; background: #0ea5e9; }
.scrub b { position: absolute; top: -3px; width: 2px; height: 14px; background: var(--muted); opacity: .45; }
.chaps { display: flex; flex-wrap: wrap; gap: 8px; }
.chaps button { font: 500 13.5px var(--font); padding: 7px 12px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink-2); cursor: pointer; }
.chaps button.on { border-color: #0ea5e9; color: var(--brand-ink); background: var(--brand-soft); font-weight: 700; }

/* ===== stage ===== */
.bgx { position: absolute; inset: 0; background:
  radial-gradient(900px 700px at 78% 45%, rgba(14,165,233,.10), transparent 70%),
  radial-gradient(700px 600px at 8% 95%, rgba(37,99,235,.07), transparent 70%), #eef2f7; }
.brand { position: absolute; left: 120px; top: 84px; display: flex; align-items: center; gap: 14px; font-size: 26px; font-weight: 700; letter-spacing: -0.02em; z-index: 40; }
.brand i { width: 42px; height: 42px; border-radius: 12px; background: linear-gradient(135deg, #0ea5e9, #2563eb); display: grid; place-items: center; color: #fff; font-style: normal; font-size: 17px; font-weight: 800; }
.brand span { font-size: 19px; font-weight: 500; color: #64748b; margin-left: 6px; letter-spacing: -0.01em; }
.cap { position: absolute; left: 120px; top: 262px; width: 600px; z-index: 40; }
.cnum { height: 34px; position: relative; margin-bottom: 26px; }
.cnum > div { position: absolute; left: 0; top: 0; display: flex; align-items: center; gap: 14px; font-size: 22px; font-weight: 700; color: #0369a1; white-space: nowrap; }
.cnum > div b { font-variant-numeric: tabular-nums; }
.cnum > div i { display: block; width: 46px; height: 2px; background: linear-gradient(90deg, #38bdf8, rgba(56,189,248,0)); }
.cnum > div span { color: #0f172a; font-weight: 600; }
.ctx { position: relative; }
.ctx .tl { position: absolute; left: 0; top: 0; width: 600px; }
.ch { font-size: 56px; font-weight: 750; letter-spacing: -0.038em; line-height: 1.08; margin: 0; }
.cbd { font-size: 28px; line-height: 1.45; color: #475569; margin-top: 28px; letter-spacing: -0.01em; }
.ch .w, .cbd .w { display: inline-block; white-space: pre; will-change: transform, filter, opacity; }
.prog { position: absolute; left: 120px; bottom: 96px; z-index: 40; }
.prog .pl { font-size: 18px; color: #64748b; margin-bottom: 14px; font-weight: 500; }
.prog .pl b { color: #0f172a; font-weight: 700; }
.prog .pb { display: flex; gap: 7px; }
.prog .pb i { display: block; width: 34px; height: 6px; border-radius: 3px; background: #d5dde8; overflow: hidden; }
.prog .pb i b { display: block; height: 100%; width: 0; background: #0ea5e9; }

.view { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; z-index: 20; -webkit-mask-image: linear-gradient(90deg, transparent 735px, #000 800px); mask-image: linear-gradient(90deg, transparent 735px, #000 800px); }
.scene { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.cursor { position: absolute; left: 0; top: 0; width: 40px; height: 40px; z-index: 90; filter: drop-shadow(0 4px 8px rgba(15,23,42,.32)); opacity: 0; pointer-events: none; }
.ring { position: absolute; left: 0; top: 0; width: 84px; height: 84px; margin: -42px 0 0 -42px; border-radius: 50%; border: 3px solid #0ea5e9; opacity: 0; z-index: 89; pointer-events: none; }
.kcap { position: absolute; z-index: 91; padding: 10px 18px; border-radius: 12px; background: #0f172a; color: #fff; font-size: 22px; font-weight: 700; box-shadow: 0 8px 24px rgba(15,23,42,.3); opacity: 0; border-bottom: 4px solid #334155; }
.hl { position: absolute; z-index: 60; border-radius: 12px; border: 2.5px solid #0ea5e9; box-shadow: 0 0 0 5px rgba(14,165,233,.16), 0 0 26px rgba(14,165,233,.35); opacity: 0; pointer-events: none; }


.touch { position: absolute; left: 0; top: 0; width: 44px; height: 44px; margin: -22px 0 0 -22px; border-radius: 50%; background: rgba(15,23,42,.18); border: 2px solid rgba(255,255,255,.85); box-shadow: 0 4px 12px rgba(15,23,42,.25); opacity: 0; z-index: 88; pointer-events: none; }

/* ===== settings page (modules/settings/views/SettingsView) ===== */
.scr { position: absolute; }
.pgw { width: 1240px; height: 820px; border-radius: 22px; background: #eef2f7; border: 1px solid #dbe3ec; box-shadow: 0 30px 70px -20px rgba(15,23,42,.35); overflow: hidden; font-size: 14px; line-height: 1.5; color: #0f172a; }
.sgrid { position: absolute; left: 32px; top: 28px; right: 32px; bottom: 0; display: grid; grid-template-columns: 248px minmax(0, 1fr); gap: 28px; }
.snav { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.snav h1 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -0.01em; line-height: 1.3; }
.ssrch { display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 12px; border: 1px solid #e2e8f0; border-radius: 12px; background: #fff; color: #94a3b8; font-size: 13.5px; }
.sgrp { display: flex; flex-direction: column; gap: 1px; }
.sgrp h2 { margin: 0; padding: 0 10px 6px; font-size: 13px; font-weight: 600; color: #475569; line-height: 1.3; }
.sni { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 10px; font-size: 14px; font-weight: 500; color: #334155; line-height: 1.35; }
.sni svg { flex-shrink: 0; color: #64748b; }
.sni span { flex: 1; min-width: 0; white-space: nowrap; }
.sni em { font-style: normal; font-size: 12px; font-weight: 600; color: #64748b; }
.sni.on { background: #fff; box-shadow: 0 1px 2px rgba(15,23,42,.08); font-weight: 600; color: #0369a1; }
.sni.on svg { color: #0369a1; }
.smain { position: relative; min-width: 0; overflow: hidden; }
.smi { display: flex; flex-direction: column; gap: 18px; padding-bottom: 300px; }
.shead { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px 20px; }
.shead .ht { display: flex; flex-direction: column; gap: 6px; min-width: 0; flex: 1 1 240px; }
.shead h2 { margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -0.015em; line-height: 1.25; }
.shead p { margin: 0; max-width: 680px; font-size: 14px; line-height: 1.5; color: #475569; }
.shead .hs { display: flex; align-items: center; gap: 8px; }

/* ui/Button (buttonStyles.ts) */
.bt { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 36px; padding: 0 14px; border: 1px solid transparent; border-radius: 999px; font-size: 13.5px; font-weight: 600; line-height: 1; white-space: nowrap; transition: none; }
.bt.sm { height: 30px; padding: 0 11px; font-size: 12.5px; }
.bt.lg { height: 40px; padding: 0 18px; font-size: 14px; }
.bt.primary { background: linear-gradient(135deg, #0284c7, #0369a1); color: #fff; box-shadow: 0 4px 12px rgba(3,105,161,.25); }
.bt.tinted { border-color: #7dd3fc; background: #f0f9ff; color: #075985; }
.bt.ghost { background: transparent; color: #475569; }
.bt.outline { border-color: #e2e8f0; background: #fff; color: #334155; }
.bt.danger { background: transparent; color: #b91c1c; }
.bt.dis { opacity: .5; }
.bt.hov.tinted { background: #e0f2fe; }
.bt.hov.ghost { background: #f1f5f9; color: #0f172a; }

/* ui/Surface: Card (one lifted surface), Panel (flat) */
.uCard { background: #fff; border-radius: 20px; border-top: 4px solid #0ea5e9; box-shadow: 0 1px 2px rgba(15,23,42,.06), 0 16px 40px rgba(15,23,42,.08); overflow: hidden; min-width: 0; }
.uPan { background: #fff; border: 1px solid #e2e8f0; border-radius: 16px; min-width: 0; }
.stit { display: flex; align-items: baseline; flex-wrap: wrap; gap: 2px 8px; margin: 0; font-size: 15px; font-weight: 700; letter-spacing: -0.005em; line-height: 1.35; }
.stit small { font-size: 13px; font-weight: 500; color: #64748b; }
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border: 1px solid #e2e8f0; border-radius: 999px; background: #f8fafc; color: #475569; font-size: 12px; font-weight: 600; line-height: 1.4; white-space: nowrap; flex-shrink: 0; }
.pill.ok { border-color: #86efac; background: #f0fdf4; color: #15803d; }

/* DocumentsSection */
.dstg { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
.dstg > section { min-width: 0; padding: 18px 22px 10px; }
.dstg > section + section { border-left: 1px solid #f1f5f9; }
.dsh { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px 12px; }
.dsh .stit { flex: 1 1 auto; }
.dsh2 { display: flex; align-items: center; justify-content: space-between; gap: 8px 12px; }
.drow { display: flex; align-items: flex-start; gap: 12px; padding: 12px 0; margin-top: 8px; }
.drow + .drow { margin-top: 0; border-top: 1px solid #f1f5f9; }
.dric { width: 36px; height: 36px; flex-shrink: 0; display: grid; place-items: center; border-radius: 10px; background: #f1f5f9; color: #64748b; }
.drt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px; }
.drt strong { font-size: 14.5px; font-weight: 600; line-height: 1.35; }
.drt .meta { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 10px; font-size: 12.5px; color: #64748b; }
.dmore { width: 30px; height: 30px; flex-shrink: 0; display: grid; place-items: center; border-radius: 8px; color: #475569; }
.fpan { padding: 16px 20px; }
.pnote { margin: 10px 0 0; font-size: 13px; line-height: 1.5; color: #64748b; }
.orow { display: flex; align-items: center; gap: 16px; }
.orow .ot { flex: 1; min-width: 0; }
.orow h3 { margin: 0; font-size: 15px; font-weight: 700; line-height: 1.35; }
.orow .oh { font-size: 12.5px; color: #475569; margin-top: 2px; line-height: 1.45; }
.orow .oh i { font-style: normal; font-weight: 600; color: #0f172a; }
.tgl { position: relative; width: 48px; height: 26px; border-radius: 999px; background: linear-gradient(180deg, #f1f5f9 0%, #e2e8f0 100%); box-shadow: inset 0 0 0 1px #cbd5e1; flex-shrink: 0; overflow: hidden; }
.tgl .tOn { position: absolute; inset: 0; border-radius: inherit; background: linear-gradient(135deg, #0ea5e9 0%, #0284c7 100%); }
.tgl b { position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: linear-gradient(180deg, #ffffff 0%, #f8fafc 100%); box-shadow: 0 1px 3px rgba(15,23,42,.25); }

/* SignatureConfigCard */
.sgc { padding: 16px 20px 18px; }
.sgh { display: flex; align-items: center; justify-content: space-between; gap: 8px 12px; }
.sgb { display: flex; flex-direction: column; gap: 14px; margin-top: 10px; }
.sgd { margin: 0; font-size: 13.5px; line-height: 1.55; color: #475569; }
.sgpv { display: flex; align-items: center; justify-content: center; min-height: 100px; border: 1px solid #e2e8f0; border-radius: 12px; background: #f8fafc; overflow: hidden; position: relative; }
.sgpv svg { display: block; padding: 12px; box-sizing: content-box; }
.sgpv .alt { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
.brow { display: flex; gap: 8px; flex-wrap: wrap; }
.pads { display: flex; flex-direction: column; gap: 10px; padding: 14px; border: 1px solid #e2e8f0; border-radius: 12px; background: #f8fafc; }
.pads > p { margin: 0; font-size: 14px; font-weight: 600; line-height: 1.4; }
.pad { position: relative; width: 100%; height: 200px; border: 1.5px dashed #cbd5e1; border-radius: 12px; background: #f8fafc; overflow: hidden; }
.pad .bl { position: absolute; left: 24px; right: 24px; bottom: 38px; border-bottom: 1px solid #e2e8f0; }
.pad .phd { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 13px; color: #cbd5e1; }
.pad .clr { position: absolute; top: 8px; right: 8px; padding: 4px 10px; font-size: 12px; font-weight: 600; line-height: 1.5; color: #667085; background: #fff; border: 1px solid #e4e7ec; border-radius: 9999px; }
.ink { position: absolute; overflow: visible; }
.ink path { fill: none; stroke: #1a1a2e; stroke-linecap: round; stroke-linejoin: round; }
.tip { position: absolute; width: 1px; height: 1px; }
.ntc { display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; border-radius: 12px; border: 1px solid #bae6fd; background: #f0f9ff; color: #075985; font-size: 13px; line-height: 1.5; }

/* toast (common/components/Toast), top right of the page */
.tst { position: absolute; z-index: 70; display: flex; align-items: center; gap: 16px; padding: 16px 24px; min-width: 320px; max-width: 500px; border-radius: 12px; background: #16a34a; color: #fff; box-shadow: 0 20px 25px -5px rgba(0,0,0,.1), 0 10px 10px -5px rgba(0,0,0,.04); opacity: 0; visibility: hidden; }
.tst .ti { width: 24px; height: 24px; flex-shrink: 0; display: grid; place-items: center; }

/* modal (ModalShell sm, sharedModalStyles) over the page */
.ovl { position: absolute; inset: 0; z-index: 50; background: rgba(15,23,42,.48); opacity: 0; visibility: hidden; }
.lm { position: absolute; z-index: 55; width: 480px; background: #fff; border-radius: 24px; box-shadow: 0 0 0 1px rgba(0,0,0,.04), 0 4px 8px -2px rgba(0,0,0,.06), 0 24px 56px -12px rgba(0,0,0,.3); overflow: hidden; opacity: 0; visibility: hidden; }

.lmh .x { width: 36px; height: 36px; flex-shrink: 0; border-radius: 50%; background: #f1f5f9; border: 1px solid #e2e8f0; color: #64748b; display: grid; place-items: center; }
.lmb { padding: 24px 28px; }
.lmb label { display: block; font-size: 13px; font-weight: 600; color: #374151; line-height: 1; margin-bottom: 8px; }
.inp { display: flex; align-items: center; height: 47px; padding: 0 14px; background: #fff; border: 1.5px solid #e2e8f0; border-radius: 10px; font-size: 14px; color: #0f172a; white-space: pre; }

.lmf { display: flex; justify-content: flex-end; gap: 10px; padding: 16px 28px; border-top: 1px solid #f1f5f9; background: #fafbfd; }

/* ===== phone ===== */

.phv { position: absolute; inset: 0; }
/* messages app */

.mhd b { font-size: 13px; font-weight: 600; }

/* /m/sig/:token page (PhoneSignatureView) */
.psg { background: #f1f3f6; display: flex; flex-direction: column; color: #101828; }
.psg .tb { padding: 66px 20px 12px; font-size: 17px; font-weight: 700; letter-spacing: -.3px; }
.psg .ct { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 0 16px 34px; gap: 14px; }

    const dt = Math.min(.1, (now - last) / 1000); last = now;
    if (playing) {
      let nt = t + dt * rate;
      if ($('optStop').checked) { const n = textStarts().find(x => x > t + .001); if (n !== undefined && nt >= n) { nt = n - .001; playing = false; syncBtn(); } }
      if (nt >= DUR) { nt = DUR - .001; playing = false; syncBtn(); }
      go(nt);
    }
    requestAnimationFrame(frame);
  };
  window.addEventListener('keydown', e => { if (e.target.closest && e.target.closest('input')) return; if (e.key === ' ') { e.preventDefault(); bPlay.click(); } if (e.key === 'ArrowRight') $('bNext').click(); if (e.key === 'ArrowLeft') $('bPrev').click(); });

  window.__start = () => {
    layout();
    $('chaps').innerHTML = CH.map((c, j) => `<button type="button">${j + 1}. ${c}</button>`).join('');
    Array.from($('chaps').children).forEach((e, j) => e.addEventListener('click', () => go(chStart[j] + .01)));
    fit(); try { new ResizeObserver(() => { fit(); ends.length = 0; go(t); }).observe(player); } catch (e) { window.addEventListener('resize', () => { fit(); ends.length = 0; go(t); }); }
    const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    go(reduce ? chStart[1] + 2 : .01); syncBtn();
    requestAnimationFrame(frame);
    window.__seek = tt => { playing = false; syncBtn(); go(tt); };
    window.__dur = DUR; window.__chStart = chStart; window.__beats = beats.map(b => [b.t0, b.d, b.ch, b.h, b.newText]);
  };
})();

(() => {
  const { P, mv, tap, cam, scr, hl, foc } = window.H;
  const B = window.beat;
  const show = (S, s, a = 0, b = .45) => { S.cur.vis = P(s, a, b); };
  const hide = (S, k) => { S.cur.vis = Math.min(S.cur.vis, 1 - k); };
  // one camera target per beat: a target that changes mid-beat makes the screen jump
  // the services, the remarks and the total: the part of the protocol the setting changes
  const ZP = { el: 'prMid', s: 1.22 };
  // the switch panel with the cards above and below it, scrolled to the same place every time
  const ZC = { el: 'pCeny', s: 1.2, dy: -20 };

  // ===== 1 Po co =====
  B(0, { h: 'Jak włączyć ceny usług na protokole?', b: '', lead: .2, act: 1.4, hold: .5 }, (S, a, s) => { S.pr = P(s, .3, 1.5); cam(S, 'pr', 1); });
  B(0, { h: 'Domyślnie protokół ma tylko kwotę łączną.', b: 'Przy usługach są same nazwy.', lead: .6, act: 2.0 }, (S, a, s) => {
    S.pr = 1; cam(S, ZP, P(s, 0, 1.3)); hl(S, a < .5 ? 'prTot' : 'prSv', a < .5 ? P(a, .1, .3) : 1, 4);
  });
  B(0, { h: 'Pokaż klientowi cenę każdej usługi.', b: 'Klient widzi, za co płaci, zanim podpisze protokół.', lead: .6, act: 1.4 }, (S, a) => {
    S.pr = 1; cam(S, ZP, 1); hl(S, 'prSv', 1, 4);
  });

  // ===== 2 Włączenie =====
  B(1, { h: 'Otwórz „Ustawienia” i „Dokumenty i podpisy”.', b: '„Ustawienia” są na dole menu po lewej.', lead: .6, act: 2.0 }, (S, a, s) => {
    S.pr = 1 - P(s, 0, .6); S.pg = P(s, .3, 1.1); cam(S, 'pg', P(s, 0, 1.3)); foc(S, ['snav', 'shd']);
    show(S, a, 0, .15); mv(S, 'nDoc', P(a, .1, .55)); S.hov = a > .5 ? 'nDoc' : null; tap(S, a, .62, 'nDoc'); hl(S, 'nDoc', P(a, .7, 1), 4);
  });
  const T1 = { h: 'Włącz „Ceny usług na protokole przyjęcia”.', b: 'Zmienić to może tylko właściciel studia.' };
  B(1, { ...T1, lead: .6, act: 1.6, hold: .1 }, (S, a, s) => {
    S.pr = 0; S.pg = 1; foc(S, ['pCeny']); scr(S, 'pCeny', 330, P(s, 0, 1.1)); cam(S, ZC, P(s, 0, 1.3)); mv(S, 'pCenyT', P(a, .2, .75), { from: 'pCenyH', fdy: 70 }); S.cur.vis = P(s, .5, .9); S.hov = a > .7 ? 'pCenyT' : null;
  });
  B(1, { ...T1, lead: 0, act: 1.4, hold: .4 }, (S, a) => {
    foc(S, ['pCeny']); scr(S, 'pCeny', 330, 1); cam(S, ZC, 1); mv(S, 'pCenyT', 1); tap(S, a, .1, 'pCenyT'); S.on = P(a, .14, .4); hl(S, 'pCeny', P(a, .5, .8), 4);
  });
  B(1, { h: 'Ustawienie zapisuje się od razu.', b: 'Nie szukaj przycisku „Zapisz”.', lead: .6, act: 1.2 }, (S, a, s) => {
    S.on = 1; foc(S, ['pCeny']); scr(S, 'pCeny', 330, 1); cam(S, ZC, 1); hide(S, P(s, 0, .4)); hl(S, 'pCenyH', P(a, 0, .4), 4);
  });

  // ===== 3 Na protokole =====
  const T2 = { h: 'Przy każdej usłudze jest jej cena brutto.', b: 'Ceny sumują się do kwoty łącznej.' };
  B(2, { ...T2, lead: .6, act: 1.8, hold: .2 }, (S, a, s) => {
    S.on = 1; S.pg = 1 - P(s, 0, .6); S.pr = P(s, .3, 1.1); cam(S, ZP, P(s, 0, 1.4)); S.prk = P(a, .45, .85); hl(S, 'prSv', P(a, .7, .95), 4);
  });
  B(2, { ...T2, lead: 0, act: 1.6, hold: .4 }, (S, a) => {
    S.pg = 0; S.pr = 1; S.prk = 1; cam(S, ZP, 1); hl(S, a < .45 ? 'prSv' : 'prTot', 1, 4);
  });
  B(2, { h: 'Ceny są na nowych protokołach przyjęcia.', b: 'Protokoły już utworzone zostają bez zmian.', lead: .6, act: 1.4, hold: .6 }, (S, a) => {
    S.pr = 1; S.prk = 1; cam(S, 'pr', P(a, 0, .7));
  });
  B(2, { h: 'Napisz do nas, jeśli masz pytania.', b: 'Kliknij „Zgłoś problem” w menu.', lead: .6, act: 1.0, hold: 6 }, (S, a) => {
    S.pr = 1; S.prk = 1; cam(S, 'pr', 1);
  });
})();

window.__start();</script>
