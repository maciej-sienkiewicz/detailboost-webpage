<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<link rel="stylesheet" href="../osadzenie.css">

</head>
<body>
<title>Jak posługiwać się kalendarzem</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
@font-face { font-family: 'InterDB'; src: url(../a/inter-latin-ext-wght-normal.woff2) format('woff2'); font-weight: 100 900; font-display: swap; unicode-range: U+0100-02AF, U+0304, U+0308, U+0329, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }
@font-face { font-family: 'InterDB'; src: url(../a/inter-latin-wght-normal.woff2) format('woff2'); font-weight: 100 900; font-display: swap; unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
/* Page: help-centre look. Stage: style B, caption column on the left, the reservation window alone on the right. */
:root {
  --bg: #eef2f7; --surface: #ffffff; --ink: #0f172a; --ink-2: #475569; --muted: #64748b; --line: #e2e8f0;
  --brand: #0ea5e9; --brand-ink: #0369a1; --brand-soft: #e0f2fe;
  --font: 'InterDB', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #0b1120; --surface: #111a2c; --ink: #e8eef7; --ink-2: #a5b4c8; --muted: #8394ab; --line: #1f2b40; --brand-ink: #7dd3fc; --brand-soft: #0c2a40; color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #0b1120; --surface: #111a2c; --ink: #e8eef7; --ink-2: #a5b4c8; --muted: #8394ab; --line: #1f2b40; --brand-ink: #7dd3fc; --brand-soft: #0c2a40; color-scheme: dark; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.55; -webkit-font-smoothing: antialiased;
  padding: 36px max(16px, env(safe-area-inset-right, 0px)) 72px max(16px, env(safe-area-inset-left, 0px)); }
.wrap { max-width: 1240px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
.eyebrow { font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--brand-ink); }
h1 { font-size: clamp(30px, 5vw, 46px); line-height: 1.08; letter-spacing: -0.035em; font-weight: 800; margin: 6px 0 0; text-wrap: balance; }
.lede { font-size: 17px; color: var(--ink-2); margin: 0; max-width: 760px; }

.player { position: relative; width: 100%; aspect-ratio: 16 / 9; border-radius: 16px; overflow: hidden; background: #eef2f7; box-shadow: 0 20px 50px rgba(15,23,42,.16); }
.stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; font-family: var(--font); color: #0f172a; background: #eef2f7; }
.bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.bar button { font: 600 14px var(--font); height: 40px; padding: 0 16px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
.bar button.pri { background: #0ea5e9; border-color: #0ea5e9; color: #fff; min-width: 120px; justify-content: center; }
.bar button:focus-visible { outline: 3px solid #38bdf8; outline-offset: 2px; }
.bar label { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; color: var(--ink-2); cursor: pointer; }
.bar .sp { flex: 1; }
.scrub { position: relative; height: 8px; border-radius: 4px; background: var(--line); cursor: pointer; }
.scrub i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; background: #0ea5e9; }
.scrub b { position: absolute; top: -3px; width: 2px; height: 14px; background: var(--muted); opacity: .45; }
.chaps { display: flex; flex-wrap: wrap; gap: 8px; }
.chaps button { font: 500 13.5px var(--font); padding: 7px 12px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink-2); cursor: pointer; }
.chaps button.on { border-color: #0ea5e9; color: var(--brand-ink); background: var(--brand-soft); font-weight: 700; }

/* ===== stage ===== */
.bgx { position: absolute; inset: 0; background:
  radial-gradient(900px 700px at 78% 45%, rgba(14,165,233,.10), transparent 70%),
  radial-gradient(700px 600px at 8% 95%, rgba(37,99,235,.07), transparent 70%), #eef2f7; }
.brand { position: absolute; left: 120px; top: 84px; display: flex; align-items: center; gap: 14px; font-size: 26px; font-weight: 700; letter-spacing: -0.02em; z-index: 40; }
.brand svg { height: 30px; width: auto; color: #0f172a; display: block; }
.brand span { font-size: 19px; font-weight: 500; color: #64748b; margin-left: 6px; letter-spacing: -0.01em; }
.cap { position: absolute; left: 120px; top: 262px; width: 600px; z-index: 40; }
.cnum { height: 34px; position: relative; margin-bottom: 26px; }
.cnum > div { position: absolute; left: 0; top: 0; display: flex; align-items: center; gap: 14px; font-size: 22px; font-weight: 700; color: #0369a1; white-space: nowrap; }
.cnum > div b { font-variant-numeric: tabular-nums; }
.cnum > div i { display: block; width: 46px; height: 2px; background: linear-gradient(90deg, #38bdf8, rgba(56,189,248,0)); }
.cnum > div span { color: #0f172a; font-weight: 600; }
.ctx { position: relative; }
.ctx .tl { position: absolute; left: 0; top: 0; width: 600px; }
.ch { font-size: 56px; font-weight: 750; letter-spacing: -0.038em; line-height: 1.08; margin: 0; }
.cbd { font-size: 28px; line-height: 1.45; color: #475569; margin-top: 28px; letter-spacing: -0.01em; }
.ch .w, .cbd .w { display: inline-block; white-space: pre; will-change: transform, filter, opacity; }
.prog { position: absolute; left: 120px; bottom: 96px; z-index: 40; }
.prog .pl { font-size: 18px; color: #64748b; margin-bottom: 14px; font-weight: 500; }
.prog .pl b { color: #0f172a; font-weight: 700; }
.prog .pb { display: flex; gap: 7px; }
.prog .pb i { display: block; width: 34px; height: 6px; border-radius: 3px; background: #d5dde8; overflow: hidden; }
.prog .pb i b { display: block; height: 100%; width: 0; background: #0ea5e9; }

.view { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; z-index: 20; -webkit-mask-image: linear-gradient(90deg, transparent 735px, #000 800px); mask-image: linear-gradient(90deg, transparent 735px, #000 800px); }
.scene { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.cursor { position: absolute; left: 0; top: 0; width: 40px; height: 40px; z-index: 90; filter: drop-shadow(0 4px 8px rgba(15,23,42,.32)); opacity: 0; pointer-events: none; }
.ring { position: absolute; left: 0; top: 0; width: 84px; height: 84px; margin: -42px 0 0 -42px; border-radius: 50%; border: 3px solid #0ea5e9; opacity: 0; z-index: 89; pointer-events: none; }
.kcap { position: absolute; z-index: 91; padding: 10px 18px; border-radius: 12px; background: #0f172a; color: #fff; font-size: 22px; font-weight: 700; box-shadow: 0 8px 24px rgba(15,23,42,.3); opacity: 0; border-bottom: 4px solid #334155; }
.hl { position: absolute; z-index: 60; border-radius: 12px; border: 2.5px solid #0ea5e9; box-shadow: 0 0 0 5px rgba(14,165,233,.16), 0 0 26px rgba(14,165,233,.35); opacity: 0; pointer-events: none; }


/* ===== calendar page (modules/calendar/components/CalendarView) ===== */
.cal { position: absolute; left: 0; top: 0; width: 1120px; height: 1008px; background: #fff; border-radius: 16px; overflow: hidden; font-size: 13px; color: #0f172a; opacity: 0; }
.cal .hd { display: flex; align-items: flex-end; justify-content: space-between; padding: 20px 16px 14px 24px; border-bottom: 1px solid rgba(15,23,42,.07); gap: 10px; }
.hd small { display: block; font-size: 12px; color: #94a3b8; font-weight: 500; letter-spacing: .02em; margin-bottom: 4px; }
.hd h4 { margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -.4px; line-height: 1.1; white-space: nowrap; }
.hr0 { display: flex; align-items: center; gap: 6px; }
.b { height: 34px; padding: 0 11px; border-radius: 10px; border: 1px solid #e2e8f0; background: #fff; color: #475569; font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.b.sq { width: 34px; padding: 0; justify-content: center; }
.b svg { flex: 0 0 auto; }
.nav { display: flex; gap: 6px; }
.seg { display: inline-flex; padding: 3px; background: #f1f5f9; border-radius: 10px; gap: 2px; }
.seg span { padding: 6px 11px; border-radius: 8px; font-size: 12px; font-weight: 600; color: #64748b; }
.seg span.on { background: #fff; color: #0f172a; box-shadow: 0 1px 2px rgba(15,23,42,.06); }
.gear { position: relative; color: #64748b; border-radius: 8px; }
.gear.open { border-color: #0ea5e9; background: #edf8fe; color: #0ea5e9; }
.gear .dot { position: absolute; top: 5px; right: 5px; width: 6px; height: 6px; border-radius: 50%; background: #0ea5e9; box-shadow: 0 0 0 2px #fff; opacity: 0; }
.ev { height: 36px; padding: 0 13px; border-radius: 999px; border: 1.5px solid rgba(245,158,11,.45); background: rgba(245,158,11,.12); color: #B45309; font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.ev.on { background: #B45309; color: #fff; border-color: #B45309; }
.np { height: 36px; padding: 0 13px; border-radius: 999px; background: #0ea5e9; color: #fff; font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; box-shadow: 0 2px 8px rgba(14,165,233,.28); white-space: nowrap; }

.fbw { padding: 8px 16px; border-bottom: 1px solid rgba(15,23,42,.07); }
.fb { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border: 1px solid #e2e8f0; border-radius: 12px; box-shadow: 0 1px 2px rgba(15,23,42,.04); min-height: 40px; }
.fb .lbl { font-size: 12px; font-weight: 600; color: #94a3b8; }
.fshow { display: inline-flex; align-items: center; gap: 8px; }
.chip { padding: 4px 10px; border-radius: 8px; background: rgba(14,165,233,.08); border: 1px solid rgba(14,165,233,.25); font-size: 12px; font-weight: 600; display: inline-flex; align-items: center; gap: 7px; }
.chip i { width: 7px; height: 7px; border-radius: 50%; background: #0ea5e9; }
.fadd { border: 1px dashed #cbd5e1; color: #64748b; font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 8px; display: inline-flex; gap: 5px; align-items: center; }
.fadd.hov { border-color: #94a3b8; background: #f8fafc; }
.fact { border: 1px solid rgba(14,165,233,.45); background: #e7f6fd; color: #0284c7; font-size: 12px; font-weight: 600; padding: 4px 8px 4px 10px; border-radius: 8px; display: none; gap: 6px; align-items: center; }
.fact b { min-width: 16px; height: 16px; border-radius: 999px; background: #0ea5e9; color: #fff; font-size: 10px; font-weight: 700; display: grid; place-items: center; padding: 0 4px; }
.fb .sp { flex: 1; }
.fclr { font-size: 12px; font-weight: 500; color: #64748b; padding: 4px 8px; border-radius: 6px; display: none; }
.fclr.hov { background: #f1f5f9; }
.cnt { font-size: 11px; font-weight: 600; color: #0284c7; background: #e0f2fe; padding: 3px 10px; border-radius: 999px; }

.modeh { overflow: hidden; height: 0; }
.modeh > div { display: flex; justify-content: center; align-items: center; gap: 10px; padding: 9px 16px; background: rgba(245,158,11,.1); border-bottom: 1px solid rgba(245,158,11,.28); color: #92400E; font-size: 13px; font-weight: 600; white-space: nowrap; }
.modeh u { text-underline-offset: 2px; }

.gh { display: grid; }
.gh span { text-align: center; font-size: 11px; font-weight: 800; color: #94a3b8; letter-spacing: 1.5px; padding: 9px 4px 3px; overflow: hidden; white-space: nowrap; }
.grid { display: grid; height: 833px; }
.cell { position: relative; border-top: 1px solid #f1f5f9; border-left: 1px solid #f1f5f9; overflow: hidden; min-width: 0; background: #fff; }
.cell:nth-child(7n+1) { border-left: 0; }
.cell.we { background: #fbfcfe; }
.cell.today { background: rgba(14,165,233,.035); }
.cell.sev { background: rgba(245,158,11,.07); box-shadow: inset 0 3px 0 0 #F59E0B; }
.cell .in { position: relative; height: 100%; }
.dn { display: flex; justify-content: center; padding-top: 5px; height: 28px; }
.dn span { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 500; color: #475569; }
.cell.oth .dn span { color: #94a3b8; font-weight: 400; }
.cell.today .dn span { background: #0ea5e9; color: #fff; font-weight: 700; box-shadow: 0 2px 6px rgba(14,165,233,.35); }
.evs { display: flex; flex-direction: column; gap: 2px; padding: 0 2px 2px; }
.tile { margin: 0 2px; padding: 1px 6px; border-radius: 5px; font-size: 11px; font-weight: 600; line-height: 1.35; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #fff; }
.tile.past { color: #475569; font-weight: 500; padding-left: 5px; }
.selx { position: absolute; inset: 0; pointer-events: none; opacity: 0; }
.bdg { position: absolute; top: 4px; display: none; align-items: center; z-index: 6; }
.bell { left: 4px; padding: 3px 5px; border-radius: 7px; background: #F59E0B; color: #fff; box-shadow: 0 1px 3px rgba(180,83,9,.35); }
.lv { right: 4px; padding: 2px 4px; border-radius: 6px; color: #ef4444; gap: 2px; font-size: 10px; font-weight: 800; }
.car { right: 4px; padding: 2px 4px; border-radius: 6px; gap: 5px; }
.car span { display: inline-flex; align-items: center; gap: 2px; font-size: 10px; font-weight: 800; }
.bdg.hov { background-color: rgba(15,23,42,.06); }
.bell.hov { background: #D97706; }
.blank .dn, .blank .evs, .blank .bdg { visibility: hidden; }

.toast { position: absolute; z-index: 70; background: #fff; border-radius: 14px; padding: 14px 18px; display: flex; gap: 12px; align-items: center; box-shadow: 0 16px 40px -10px rgba(15,23,42,.3); border: 1.5px solid #bbf7d0; opacity: 0; visibility: hidden; white-space: nowrap; }
.toast .ok { width: 30px; height: 30px; border-radius: 50%; background: #dcfce7; color: #16a34a; display: grid; place-items: center; }
.toast b { display: block; font-size: 15px; }
.toast small { display: block; font-size: 13px; color: #64748b; }

/* ===== floating layers (all live in the scene, placed by the engine) ===== */
.lay { position: absolute; left: 0; top: 0; opacity: 0; visibility: hidden; z-index: 50; }
.card { background: #fff; border-radius: 12px; border: 1px solid #e2e8f0; box-shadow: 0 12px 32px rgba(15,23,42,.12), 0 1px 3px rgba(15,23,42,.06); }

/* tooltip over a badge */
.tt { min-width: 200px; max-width: 290px; padding: 10px 12px; border-radius: 12px; border: 1px solid rgba(15,23,42,.08); background: #fff; box-shadow: 0 4px 6px rgba(0,0,0,.03), 0 12px 28px rgba(0,0,0,.12); z-index: 80; }
.tt .t { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; color: #94a3b8; margin-bottom: 7px; }
.tt .r { display: flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 500; padding: 3px 0; white-space: nowrap; }
.tt .r i { width: 6px; height: 6px; border-radius: 50%; flex: 0 0 auto; }
.tt .a { font-size: 11.5px; color: #94a3b8; padding: 0 0 3px 13px; }

/* search (CalendarSearchModal) */
.sm { width: 640px; border-radius: 16px; background: #fff; box-shadow: 0 4px 6px rgba(0,0,0,.03), 0 16px 32px rgba(0,0,0,.12), 0 32px 64px rgba(0,0,0,.08); overflow: hidden; }
.smh { display: flex; align-items: center; gap: 12px; padding: 16px 20px; border-bottom: 1px solid #f1f5f9; }
.smh .q { flex: 1; font-size: 16px; color: #0f172a; white-space: pre; }
.smh .q.ph { color: #94a3b8; }
.smh .x { width: 28px; height: 28px; border-radius: 50%; background: #f1f5f9; color: #64748b; display: grid; place-items: center; }
.sme { padding: 34px 20px 38px; text-align: center; }
.sme .ic { width: 48px; height: 48px; border-radius: 12px; background: #f8fafc; color: #cbd5e1; display: grid; place-items: center; margin: 0 auto 12px; }
.sme b { display: block; font-size: 14px; font-weight: 500; color: #94a3b8; }
.sme small { display: block; font-size: 13px; color: #cbd5e1; margin-top: 2px; }
.smres { padding: 10px 0 10px; }
.smc { font-size: 12px; color: #94a3b8; padding: 0 20px 4px; }
.smd { font-size: 11px; font-weight: 700; letter-spacing: .8px; color: #94a3b8; padding: 10px 20px 6px; text-transform: uppercase; }
.smr { display: grid; grid-template-columns: 1fr auto; gap: 14px; padding: 10px 20px; align-items: center; }
.smr.done { opacity: .42; }
.smr.hov { background: #f8fafc; }
.smr .tt1 { display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 600; }
.smr .tt1 i { width: 10px; height: 10px; border-radius: 50%; flex: 0 0 auto; }
.smr .mt { display: flex; gap: 10px; font-size: 12px; color: #64748b; margin: 3px 0 0 20px; }
.smr .pr { text-align: right; font-size: 13px; font-weight: 700; white-space: nowrap; }
.smr .pr small { display: block; font-size: 11px; font-weight: 400; color: #94a3b8; }
.fly { width: 300px; height: 68px; background: #fff; border-radius: 12px; border-top: 3px solid #f97316; box-shadow: 0 0 0 2px rgba(249,115,22,.27), 0 8px 32px rgba(0,0,0,.18); padding: 10px 14px; display: flex; gap: 12px; align-items: center; z-index: 85; }
.fly .av { width: 36px; height: 36px; border-radius: 50%; background: rgba(249,115,22,.1); border: 1.5px solid rgba(249,115,22,.27); color: #f97316; display: grid; place-items: center; font-size: 15px; font-weight: 700; flex: 0 0 auto; }
.fly b { display: block; font-size: 13px; font-weight: 600; color: #1e293b; white-space: nowrap; }
.fly small { display: block; font-size: 11px; color: #64748b; }
.fly em { margin-left: auto; font-style: normal; font-size: 13px; font-weight: 700; color: #f97316; white-space: nowrap; }

/* filter popup (CalendarFilterBar) */
.fp { display: flex; align-items: flex-start; overflow: hidden; }
.fp1 { width: 220px; padding: 8px; flex: 0 0 auto; }
.fcat { display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 10px; }
.fcat.on { background: #f0f9ff; }
.fcat .ic { width: 26px; height: 26px; border-radius: 8px; background: #f1f5f9; color: #64748b; display: grid; place-items: center; flex: 0 0 auto; }
.fcat b { flex: 1; font-size: 13px; font-weight: 600; }
.pc { font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 999px; color: #94a3b8; background: #f1f5f9; }
.pc.part { color: #0284c7; background: #e0f2fe; }
.fcat .chv { color: #94a3b8; }
.fp2w { overflow: hidden; flex: 0 0 auto; border-left: 1px solid #e2e8f0; }
.fp2 { width: 300px; padding: 8px; }
.fp2h { display: flex; justify-content: space-between; align-items: center; padding: 6px 10px 8px; font-size: 10px; font-weight: 700; letter-spacing: .1em; color: #94a3b8; }
.fp2h span { color: #0284c7; font-weight: 600; letter-spacing: 0; padding: 2px 6px; border-radius: 6px; }
.fo { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; font-size: 13px; }
.fo.on { background: #f0f9ff; }
.fo > i { width: 10px; height: 10px; border-radius: 50%; flex: 0 0 auto; }
.fo .lb { flex: 1; }
.fo .only { font-size: 10px; font-weight: 600; color: #64748b; border: 1px solid #e2e8f0; border-radius: 6px; padding: 2px 7px; opacity: 0; }
.fo.hov { background: #f8fafc; }
.fo.hov.on { background: #e8f5fd; }
.fo.hov .only { opacity: 1; }
.fo .ck { color: #0284c7; width: 14px; height: 14px; flex: 0 0 auto; }
.fo:not(.on) .ck { visibility: hidden; }

/* add menu under "Wydarzenie" */
.am { width: 260px; border-radius: 10px; overflow: hidden; }
.ami { display: flex; align-items: flex-start; gap: 10px; padding: 11px 14px; }
.ami + .ami { border-top: 1px solid #f1f5f9; }
.ami.hov { background: #f8fafc; }
.ami svg { color: #0369a1; margin-top: 2px; flex: 0 0 auto; }
.ami b { display: block; font-size: 13px; font-weight: 600; }
.ami small { display: block; font-size: 11.5px; color: #64748b; }

/* display settings */
.dsp { width: 320px; overflow: hidden; }
.dsr { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; font-size: 13px; font-weight: 600; }
