<div class="wrap">
  <header>
    <div class="eyebrow">DetailBoost, instrukcje</div>
    <h1>Jak wyłączyć kartę wizyty?</h1>
  </header>
  <p class="lede">Animacja pokazuje, gdzie w ustawieniach wyłączyć kartę wizyty i co się wtedy zmienia przy rezerwacji i przyjęciu auta. Wybierz rozdział pod animacją, żeby przejść od razu do niego.</p>

  <div class="player" id="player" aria-label="Animacja: jak wyłączyć kartę wizyty">
    <div class="stage" id="stage">
      <div class="bgx"></div>
      <div class="brand"><i>DB</i>DetailBoost<span>Instrukcja</span></div>
      <div class="cap">
        <div class="cnum" id="cnum"></div>
        <div class="ctx" id="ctx"></div>
      </div>
      <div class="prog"><div class="pl" id="pl"></div><div class="pb" id="pb"></div></div>

      <div class="view" id="view"><div class="scene" id="scene"></div></div>

      <div class="hl" id="hl"></div>
      <div class="ring" id="ring"></div>
      <div class="touch" id="touch"></div>
      <svg class="cursor" id="cursor" viewBox="0 0 24 24"><path d="M4 2l16 9.5-7 1.6-3.2 6.9z" fill="#0f172a" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg>
    </div>
  </div>

  <div class="scrub" id="scrub"><i id="scrubI"></i></div>
  <div class="bar">
    <button type="button" id="bPrev">‹ Poprzedni krok</button>
    <button type="button" class="pri" id="bPlay">Odtwórz</button>
    <button type="button" id="bNext">Następny krok ›</button>
    <span class="sp"></span>
    <label><input type="checkbox" id="optStop"> Zatrzymuj po każdym kroku</label>
    <button type="button" id="bRate">Tempo 1×</button>
  </div>
  <div class="chaps" id="chaps"></div>
</div>
<script>
(() => {

(() => {
